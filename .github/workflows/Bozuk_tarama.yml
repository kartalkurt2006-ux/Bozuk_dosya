name: BIST Avci Otomatik Tarama

on:
  schedule:
    - cron: '*/15 6-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests pytz

      - name: Avci Scriptini Çalıştır
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: |
          python tarama.py

      - name: Hafıza Dosyasını Güncelle ve Kaydet
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          touch borsa_hafiza_v2.json
          git add borsa_hafiza_v2.json
          git commit -m "Otomatik hafıza güncellemesi" || echo "Değişiklik yok"
          git pull origin main --rebase || true
          git push origin main || echo "Push atlanıyor"
